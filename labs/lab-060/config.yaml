metadata:
  name: "ats-003-lab-060"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - name: "target"
    image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

  - name: "gateway"
    image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "install-traceroute"
      description: "Installs traceroute on the target VM so the solution's verification commands run without a 'command not found' error"
      type: "file"
      source: "bootstrap/install-traceroute.sh"
      vm: "target"

    - name: "gateway-setup"
      description: "Turns the gateway VM into the partner-subnet gateway: enables IP forwarding persistently and creates dummy0 addressed 10.10.30.1/24, the address the target's route ultimately reaches"
      type: "file"
      source: "bootstrap/gateway-setup.sh"
      vm: "gateway"

validation:
  scripts:
    - name: "verify-route-live"
      description: "Confirms 'ip route show 10.10.30.0/24' resolves via the gateway VM's real resolved address in the live kernel routing table"
      type: "file"
      source: "validation/validate-route-live.sh"
      vm: "target"

    - name: "verify-route-get"
      description: "Confirms 'ip route get 10.10.30.1' selects the gateway VM's real resolved address"
      type: "file"
      source: "validation/validate-route-get.sh"
      vm: "target"

    - name: "verify-route-persistent"
      description: "Confirms the route to 10.10.30.0/24 via the gateway is declared in a persistent network config (Netplan, systemd-networkd, NetworkManager, or legacy route-* file), not just added live with ip route add"
      type: "file"
      source: "validation/validate-route-persistent.sh"
      vm: "target"

    - name: "verify-route-reachability"
      description: "Real end-to-end proof: pings 10.10.30.1 (the gateway VM's own address in the partner subnet) through the route — only passes if the gateway is actually forwarding, not just present in the routing table"
      type: "file"
      source: "validation/validate-route-reachability.sh"
      vm: "target"

    - name: "verify-gateway-ready"
      description: "Confirms the gateway VM itself is actually able to act as a gateway: IP forwarding on, dummy0 up with 10.10.30.1/24"
      type: "file"
      source: "validation/validate-gateway-ready.sh"
      vm: "gateway"

teardown:
  keepCluster: false
