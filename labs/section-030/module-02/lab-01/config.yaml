metadata:
  name: "ats-003-lab-032"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "firewalld-lab-setup"
      description: "Installs firewalld via apt-get, disables ufw so it can't conflict with firewalld's nftables/iptables backend, and enables+starts firewalld with the primary interface bound to a sane public zone"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-firewalld-active"
      description: "Confirms firewalld is enabled and running"
      type: "file"
      source: "validation/validate-firewalld-active.sh"

    - name: "verify-default-zone"
      description: "Confirms the default zone is public"
      type: "file"
      source: "validation/validate-default-zone.sh"

    - name: "verify-interface-zone"
      description: "Confirms the primary (default-route) interface is bound to the public zone"
      type: "file"
      source: "validation/validate-interface-zone.sh"

    - name: "verify-https-runtime"
      description: "Confirms https is allowed in the public zone's runtime configuration"
      type: "file"
      source: "validation/validate-https-runtime.sh"

    - name: "verify-https-permanent"
      description: "Confirms https is allowed in the public zone's permanent configuration"
      type: "file"
      source: "validation/validate-https-permanent.sh"

    - name: "verify-port-8443-runtime"
      description: "Confirms 8443/tcp is allowed in the public zone's runtime configuration"
      type: "file"
      source: "validation/validate-port-8443-runtime.sh"

    - name: "verify-port-8443-permanent"
      description: "Confirms 8443/tcp is allowed in the public zone's permanent configuration"
      type: "file"
      source: "validation/validate-port-8443-permanent.sh"

teardown:
  keepCluster: false
