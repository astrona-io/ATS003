# Course manifest for ATS003 - Networking (Linux Foundation Certified System
# Administrator, LFCS).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section quiz and the section capstone close the section.
# Playgrounds are not listed: the landing page's <!-- astrona:playground -->
# marker shows them. solution.md files are never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS003
  title: "LFCS: Networking"
  description: >
    Training material covering the Linux Foundation Certified System Administrator (LFCS) Networking domain, with hands-on labs for each competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Networking
    weight: 25

modules:

