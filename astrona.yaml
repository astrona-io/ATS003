training:
  id: ATS003
  title: "LFCS: Networking"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Networking domain, with hands-on labs for each
    competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Networking
    weight: 25

