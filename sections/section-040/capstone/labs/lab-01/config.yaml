metadata:
  name: ats-003-lab-040
  docs:
    solution: solution.md
    question: question.md
runtime:
  type: qemu
  qemu:
  - name: client
    image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    validation:
      scripts:
      - name: verify-system-resolver-a-record
        description: Confirms the client's default resolver (dig, no @server) returns 192.168.10.80 for
          data-001.internal.example.com
        type: file
        source: validation/validate-system-resolver-a-record.sh
      - name: verify-direct-server-a-record
        description: Confirms a direct query to the dns VM's real address returns the same A record as
          the system resolver
        type: file
        source: validation/validate-direct-server-a-record.sh
      - name: verify-ns-record
        description: Confirms internal.example.com's NS record is ns1.internal.example.com
        type: file
        source: validation/validate-ns-record.sh
      - name: verify-mx-record
        description: Confirms internal.example.com's MX record is priority 10, mail.internal.example.com
        type: file
        source: validation/validate-mx-record.sh
      - name: verify-ptr-record
        description: Confirms the reverse (PTR) lookup for 192.168.10.80 resolves to data-001.internal.example.com
        type: file
        source: validation/validate-ptr-record.sh
    networks:
    - name: service-net
      ipv4: 192.168.10.10
  - name: dns
    image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    bootstrap:
      init:
      - name: configure-zones
        description: Serves the internal.example.com forward zone plus its reverse zone from the dns VM,
          listening on all interfaces
        type: file
        source: bootstrap/configure-zones.sh
    validation:
      scripts:
      - name: verify-dns-server-ready
        description: Confirms bind9 is actually running and the zones loaded cleanly on the dns VM
        type: file
        source: validation/validate-dns-server-ready.sh
    networks:
    - name: service-net
      ipv4: 192.168.10.53
  networks:
  - name: service-net
    cidr: 192.168.10.0/24
teardown:
  keepCluster: false
