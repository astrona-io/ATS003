# Network Interfaces and IPv4 & IPv6 Addressing (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM (a plain Linux host, no Kubernetes). It gets only the
# normal astrona management interface. The two extra NICs the module inspects are
# created inside the VM by bootstrap/prepare.sh as `dummy` devices — astrona's
# qemu backend only does point-to-point segments (exactly 2 VMs each), so a
# one-VM sandbox cannot attach an isolated segment. dummy devices behave like a
# normal NIC for link-state and addressing, which is all this module needs.

metadata:
  name: "network-interfaces-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install ip/link tools; address one extra NIC (v4 + v6), leave the other UP with no IP."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        # Same LFCS base image the graded labs use. {ARCH} is substituted by the
        # CLI (arm64 / amd64).
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 20
      display: false
      # No extra segments: the two NICs the module inspects are dummy devices
      # created in bootstrap/prepare.sh.
      sshPasswordAuth: false
