metadata:
  name: "ats-003-lab-012"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "hostname-lab-setup"
      description: "Sets a generic pre-rename static hostname and seeds a matching stale /etc/hosts 127.0.1.1 entry, so the static-hostname rename task is realistic"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-static-hostname"
      description: "Confirms /etc/hostname (the persisted static hostname) equals web-srv1"
      type: "file"
      source: "validation/validate-static-hostname.sh"

    - name: "verify-transient-hostname"
      description: "Confirms the live `hostname` command reports web-srv1, proving the rename is active now, not just pending a reboot"
      type: "file"
      source: "validation/validate-transient-hostname.sh"

    - name: "verify-pretty-hostname"
      description: "Confirms hostnamectl's pretty hostname equals 'Web Server 1 (Frankfurt)'"
      type: "file"
      source: "validation/validate-pretty-hostname.sh"

    - name: "verify-hosts-entry"
      description: "Confirms /etc/hosts's 127.0.1.1 line was updated to reference web-srv1"
      type: "file"
      source: "validation/validate-hosts-entry.sh"

teardown:
  keepCluster: false
