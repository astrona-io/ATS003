# Managing Linux Hostnames (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM (a plain Ubuntu host with systemd, no Kubernetes).
# Everything this module covers — hostnamectl, /etc/hostname, the static /
# transient / pretty hostname types — is local to one machine.
# bootstrap/prepare.sh seeds a plain static hostname, an unset pretty hostname,
# and a deliberately different transient hostname so all three are visible in
# `hostnamectl status`.

metadata:
  name: "linux-hostnames-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Seed static / transient / pretty hostnames so hostnamectl status shows all three."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
        checksums:
          amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
          arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 20
      sshPasswordAuth: false
