# firewalld Zones and Services (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server, no Kubernetes.
# OS prep installs firewalld, starts it at its stock defaults (default zone
# `public`, ssh allowed, nothing custom added), and brings up one extra NIC so
# interface-to-zone assignment is something you can actually see. Everything
# else — adding services, opening ports, moving interfaces between zones — is
# left for you to do with `firewall-cmd`.

metadata:
  name: "firewalld-zones-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install + start firewalld at defaults, address the extra NIC, install probe tools."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  networks:
    # One isolated L2 segment. Nothing else is on it — it exists only so the VM
    # has a second interface to assign between zones (`firewall-cmd
    # --change-interface`), with a reachable-looking address on it.
    - name: fwd-net
      cidr: 192.168.90.0/24
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-24.04-server-docker:arm64"
      arch: "arm64"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 20
      networks:
        # One extra interface on top of the default management interface.
        - { name: fwd-net, ipv4: 192.168.90.10 }
      sshPasswordAuth: false
