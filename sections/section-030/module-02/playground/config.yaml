# firewalld Zones and Services (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server, no Kubernetes.
# OS prep installs firewalld, starts it at its stock defaults (default zone
# `public`, ssh allowed, nothing custom added), and brings up a second local
# interface (a dummy netdev — see bootstrap/prepare.sh; astrona's qemu backend
# only supports networks joined by exactly 2 VMs, so a solo VM cannot get one
# via runtime.networks) so interface-to-zone assignment is something you can
# actually see. Everything else — adding services, opening ports, moving
# interfaces between zones — is left for you to do with `firewall-cmd`.

metadata:
  name: "firewalld-zones-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install + start firewalld at defaults, address the extra NIC, install probe tools."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
        checksums:
          amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
          arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 20
      sshPasswordAuth: false
