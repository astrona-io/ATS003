# Packet Filtering with nftables (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server, no Kubernetes. The
# nftables ruleset is left EMPTY on purpose: building the table -> chain -> rule
# structure yourself, and watching it filter live traffic, is the whole point.
# OS prep installs `nft` and a few test tools, brings up a second local source
# address for `ip saddr` rules (a dummy interface — see bootstrap/prepare.sh;
# astrona's qemu backend only supports networks joined by exactly 2 VMs, so a
# solo VM cannot get a second address via runtime.networks), and flushes the
# ruleset so `nft list ruleset` starts blank.

metadata:
  name: "nftables-filtering-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install nftables + test tools, address the extra NIC, flush the ruleset so it starts empty."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 20
      sshPasswordAuth: false
