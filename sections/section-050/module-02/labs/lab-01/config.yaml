metadata:
  name: ats-003-lab-052
  docs:
    solution: solution.md
    question: question.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
bootstrap:
  init:
  - name: install-nginx
    description: Enables/starts nginx (ships in the base LFCS image)
    type: folder
    source: bootstrap/10-install-nginx/
  - name: deploy-existing-apps
    description: Deploys the two pre-existing, off-limits apps on ports 1111 and 2222
      (with /special on 2222) that the new reverse proxy/load balancer config must
      route around without modifying
    type: folder
    source: bootstrap/20-deploy-existing-apps/
validation:
  scripts:
  - name: verify-nginx-syntax
    description: Confirms `nginx -t` reports the full merged configuration as syntactically
      valid
    type: file
    source: validation/validate-nginx-syntax.sh
  - name: verify-existing-apps-untouched
    description: Confirms the pre-existing apps on ports 1111 and 2222 (including
      /special on 2222) still serve their original, unmodified content
    type: file
    source: validation/validate-existing-apps-untouched.sh
  - name: verify-loadbalancer-8000
    description: Confirms port 8000 load-balances traffic across both the 1111 and
      2222 backends
    type: file
    source: validation/validate-loadbalancer-8000.sh
teardown:
  keepCluster: false
