# Nginx Load Balancers (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server. OS prep installs
# nginx and THREE labelled echo backends on 127.0.0.1:9001/9002/9003, plus a
# working round-robin load balancer on port 8080 (`/etc/nginx/conf.d/lb.conf`).
# The base config balances evenly — changing the METHOD (weights, least_conn,
# hash, ip_hash) and the HEALTH-CHECK behaviour (max_fails, fail_timeout,
# backup) is what you do here.

metadata:
  name: "nginx-lb-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install nginx + three echo backends and a round-robin LB on :8080."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-24.04-server-docker:arm64"
      arch: "arm64"
      cpus: 1
      memoryMB: 1536
      diskSizeGB: 20
      sshPasswordAuth: false
