# Nginx Reverse Proxy (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server. OS prep installs
# nginx (serving its default page on :80) and TWO small backend apps on
# 127.0.0.1:9001 and :9002 that echo back the request line and the headers
# they received. Nginx is NOT proxying to them yet — writing the `location` /
# `proxy_pass` blocks and watching what reaches each backend is the point.

metadata:
  name: "nginx-proxy-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install nginx + two request-echo backends, leave nginx serving its default page."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 1
      memoryMB: 1536
      diskSizeGB: 20
      sshPasswordAuth: false
