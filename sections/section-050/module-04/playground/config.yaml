# OpenSSH Client (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server. OS prep creates the
# users `cadet` (the visitor) and `pilot`, starts two throwaway sshd services
# (port 2222 = the "station", port 2223 = the "relay" jump host) and a web
# service on 127.0.0.1:8081 that only a tunnel can reach "from outside".

metadata:
  name: "ssh-client-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Create the cadet and pilot users, two throwaway sshd services on 2222 and 2223, and a loopback-only web service on 8081."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
        checksums:
          amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
          arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
      cpus: 1
      memoryMB: 1536
      diskSizeGB: 20
      sshPasswordAuth: false
