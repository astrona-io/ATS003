metadata:
  name: "ats-003-lab-053"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "install-openssh"
      description: "Enables openssh-server (openssh-server, openssh-client, and sshpass all ship in the base LFCS image)"
      type: "folder"
      source: "bootstrap/"

    - name: "create-test-users"
      description: "Creates local users elena and victor with password authentication (password = username) and no SSH keys"
      type: "folder"
      source: "bootstrap/"

    - name: "baseline-sshd-config"
      description: "Sets the pre-hardening sshd_config baseline (PasswordAuthentication yes, X11Forwarding yes) that the lab task requires changing, without touching the astrona admin user's key-based access"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-sshd-service"
      description: "Confirms the sshd/ssh service is active"
      type: "file"
      source: "validation/validate-sshd-service.sh"

    - name: "verify-x11forwarding"
      description: "Confirms X11Forwarding is disabled in the effective sshd config (sshd -T)"
      type: "file"
      source: "validation/validate-x11forwarding.sh"

    - name: "verify-passwordauth-config"
      description: "Confirms PasswordAuthentication resolves to yes for elena and no for victor via sshd -T -C"
      type: "file"
      source: "validation/validate-passwordauth-config.sh"

    - name: "verify-banner"
      description: "Confirms Banner resolves to /etc/ssh/sshd-banner for elena and victor via sshd -T -C, and the file exists"
      type: "file"
      source: "validation/validate-banner.sh"

    - name: "verify-ssh-login"
      description: "Confirms real SSH login behavior: elena authenticates with a password, victor is rejected"
      type: "file"
      source: "validation/validate-ssh-login.sh"

teardown:
  keepCluster: false
