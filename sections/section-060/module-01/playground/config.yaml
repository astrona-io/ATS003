# Persistent Network Managers (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: a single qemu VM — a plain Ubuntu 24.04 server with ONE extra NIC on
# an isolated segment (192.168.120.0/24, no DHCP, no router). OS prep installs
# NetworkManager and tells it to manage ONLY that spare NIC — the management
# interface that carries your SSH session is left `unmanaged`, so nothing you do
# with nmcli can drop the session. The spare NIC starts with no connection
# profile: building persistent profiles with nmcli is the point.

metadata:
  name: "networkmanager-nmcli-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install NetworkManager, restrict it to the spare NIC, leave the SSH NIC unmanaged."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  networks:
    - name: nm-net
      cidr: 192.168.120.0/24
  qemu:
    - name: "host"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
        checksums:
          amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
          arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
      cpus: 1
      memoryMB: 1536
      diskSizeGB: 20
      networks:
        - { name: nm-net }
      sshPasswordAuth: false
