metadata:
  name: networkmanager-nmcli-playground
  docs:
    guide: docs/overview.md
bootstrap:
  init:
  - name: practice-interfaces
    description: Create isolated practice interfaces without changing the management
      NIC.
    type: file
    source: bootstrap/practice-interfaces.sh
  - name: prepare
    description: Install NetworkManager, restrict it to the spare NIC, leave the SSH
      NIC unmanaged.
    type: file
    source: bootstrap/prepare.sh
  manifests: []
teardown:
  keepCluster: false
runtime:
  type: qemu
  qemu:
  - name: host
    image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
    cpus: 1
    memoryMB: 1536
    diskSizeGB: 20
    sshPasswordAuth: false
