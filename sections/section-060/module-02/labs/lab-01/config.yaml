metadata:
  name: "ats-003-lab-062"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "network-tools-lab-setup"
      description: "Creates /opt/course for recording the private and public addresses (curl and dnsutils ship in the base LFCS image)"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-private-ip"
      description: "Confirms /opt/course/private_ip holds an RFC1918 address that is actually bound to a local interface"
      type: "file"
      source: "validation/validate-private-ip.sh"

    - name: "verify-public-ip"
      description: "Confirms /opt/course/public_ip matches a fresh HTTPS IPv4 lookup from this VM; unavailable lookups are infrastructure failures"
      type: "file"
      source: "validation/validate-public-ip.sh"

teardown:
  keepCluster: false
