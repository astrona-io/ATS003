# Knowledge check for section 060. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats003-060
course_id: ATS003
exam_code: LFCS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-060
  title: "Persistent Configuration And Diagnostics"
questions:
  - id: ats003-060-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell a device from a connection profile in NetworkManager"
    source_readings:
      - sections/section-060/module-01/course-01-devices-and-profiles.md
    prompt: "In `nmcli`, what is the difference between a device and a connection?"
    options:
      - id: a
        text: "They are two names for the same list."
        explanation: "The two lists differ."
      - id: b
        text: "A device is the network hardware. A connection is a saved profile that can be applied to it."
        explanation: "Correct. `nmcli device status` lists hardware. `nmcli connection show` lists profiles."
      - id: c
        text: "A device is a profile and a connection is a cable."
        explanation: "The meanings are reversed."
      - id: d
        text: "A connection is a firewall zone."
        explanation: "Zones belong to firewalld."
    correct_option: b
    explanation: "`nmcli device status` lists hardware. `nmcli connection show` lists profiles."

  - id: ats003-060-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Change a profile and apply it"
    source_readings:
      - sections/section-060/module-01/course-03-change-and-reactivate.md
    prompt: "After you change a setting with `nmcli connection modify`, what must you do to apply it?"
    options:
      - id: a
        text: "Bring the connection up again with `nmcli connection up <name>`."
        explanation: "Correct. The change is saved in the profile and takes effect when the profile is reactivated."
      - id: b
        text: "Nothing, it is applied at once."
        explanation: "The running link keeps its old settings until reactivation."
      - id: c
        text: "Run `netplan generate`."
        explanation: "That is Netplan's command, not NetworkManager's."
      - id: d
        text: "Reboot the machine."
        explanation: "A reactivation is enough."
    correct_option: a
    explanation: "The change is saved in the profile and takes effect when the profile is reactivated."

  - id: ats003-060-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Test a Netplan change safely"
    source_readings:
      - sections/section-060/module-02/course-03-apply-and-merge.md
    prompt: "Which command applies a Netplan change and rolls it back if you do not confirm?"
    options:
      - id: a
        text: "`sudo netplan get`"
        explanation: "This only prints the merged configuration."
      - id: b
        text: "`sudo netplan generate`"
        explanation: "This renders files and does not apply them."
      - id: c
        text: "`sudo netplan status`"
        explanation: "This shows state and changes nothing."
      - id: d
        text: "`sudo netplan try`"
        explanation: "Correct. If you do not confirm within the timeout the previous configuration returns. This protects a remote session."
    correct_option: d
    explanation: "If you do not confirm within the timeout the previous configuration returns. This protects a remote session."

  - id: ats003-060-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Know where Netplan files live"
    source_readings:
      - sections/section-060/module-02/course-02-write-and-render.md
    prompt: "Where do Netplan files for Ubuntu 24.04 live, and how are several files combined?"
    options:
      - id: a
        text: "In `/etc/network/interfaces`."
        explanation: "This is the old ifupdown file."
      - id: b
        text: "In `/etc/hosts.d/`."
        explanation: "No such directory is used by Netplan."
      - id: c
        text: "In `/etc/netplan/*.yaml`, read in order of file name, with later files overriding earlier ones."
        explanation: "Correct. Numbered prefixes such as `70-` control the order."
      - id: d
        text: "Only the first file is read."
        explanation: "All files are merged."
    correct_option: c
    explanation: "Numbered prefixes such as `70-` control the order."

  - id: ats003-060-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "List listening TCP sockets with owners"
    source_readings:
      - sections/section-060/module-03/course-01-listening-sockets.md
    prompt: "Which command lists listening TCP sockets with numeric ports and the owning process?"
    options:
      - id: a
        text: "`ss -u`"
        explanation: "This lists UDP sockets."
      - id: b
        text: "`sudo ss -tlnp`"
        explanation: "Correct. `-t` is TCP, `-l` listening, `-n` numeric, `-p` process. The process needs root to be seen."
      - id: c
        text: "`ip -s link`"
        explanation: "This shows interface counters."
      - id: d
        text: "`sudo ss -a`"
        explanation: "This shows all sockets, not only listening TCP, and no processes."
    correct_option: b
    explanation: "`-t` is TCP, `-l` listening, `-n` numeric, `-p` process. The process needs root to be seen."

  - id: ats003-060-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the process that holds a port"
    source_readings:
      - sections/section-060/module-03/course-03-filter-and-find-the-holder.md
    prompt: "Which command shows the process that listens on TCP port 8080?"
    options:
      - id: a
        text: "`sudo ss -tlnp 'sport = :8080'`"
        explanation: "Correct. The filter limits the output to one source port."
      - id: b
        text: "`ss -tlnp | grep 80`"
        explanation: "This also matches 8080, 8000 and other lines with 80."
      - id: c
        text: "`sudo ip route get :8080`"
        explanation: "This shows a route, not a listener."
      - id: d
        text: "`sudo ss -x`"
        explanation: "This lists Unix sockets."
    correct_option: a
    explanation: "The filter limits the output to one source port."

  - id: ats003-060-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Capture DNS packets on an interface"
    source_readings:
      - sections/section-060/module-04/course-01-first-capture.md
    prompt: "Which command shows DNS packets on `eth0` without turning addresses into names?"
    options:
      - id: a
        text: "`sudo tcpdump eth0 port 53`"
        explanation: "The interface needs `-i`."
      - id: b
        text: "`sudo ss -ni eth0 port 53`"
        explanation: "`ss` does not capture packets."
      - id: c
        text: "`sudo ping -i eth0 53`"
        explanation: "`ping` does not capture packets."
      - id: d
        text: "`sudo tcpdump -ni eth0 port 53`"
        explanation: "Correct. `-n` stops name lookups, `-i` selects the interface and `port 53` is the filter."
    correct_option: d
    explanation: "`-n` stops name lookups, `-i` selects the interface and `port 53` is the filter."

  - id: ats003-060-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Save and read a capture"
    source_readings:
      - sections/section-060/module-04/course-03-contents-and-files.md
    prompt: "How do you save a capture to a file and read it later?"
    options:
      - id: a
        text: "Redirect the screen with `> capture.pcap` and open it in a text editor."
        explanation: "Packets are binary data, not text."
      - id: b
        text: "`tcpdump -s capture.pcap`"
        explanation: "`-s` sets the snapshot length."
      - id: c
        text: "Write it with `tcpdump -w capture.pcap` and read it with `tcpdump -r capture.pcap`."
        explanation: "Correct. `-w` writes raw packets and `-r` reads them back with any filter you like."
      - id: d
        text: "`ss -w capture.pcap`"
        explanation: "`ss` does not capture packets."
    correct_option: c
    explanation: "`-w` writes raw packets and `-r` reads them back with any filter you like."

  - id: ats003-060-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the order of the troubleshooting ladder"
    source_readings:
      - sections/section-060/module-05/course-01-work-up-the-ladder.md
    prompt: "In which order do you check a broken connection?"
    options:
      - id: a
        text: "Firewall, port, name, route, address, link."
        explanation: "This runs the ladder from the top, which wastes time."
      - id: b
        text: "Link, address, route, name, port, firewall."
        explanation: "Correct. Each rung depends on the one before it, so you climb from the bottom and stop at the first failure."
      - id: c
        text: "Name, link, firewall, address, port, route."
        explanation: "The order is not sensible, because a name needs a working path."
      - id: d
        text: "Port, name, link, firewall, route, address."
        explanation: "The order is mixed up."
    correct_option: b
    explanation: "Each rung depends on the one before it, so you climb from the bottom and stop at the first failure."

  - id: ats003-060-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the error text to find the broken rung"
    source_readings:
      - sections/section-060/module-05/course-01-work-up-the-ladder.md
    prompt: "`ping 10.66.0.20` works, but `ping portal.lab` says `Name or service not known`. Which rung is broken?"
    options:
      - id: a
        text: "The name rung. Check `/etc/hosts`, `nsswitch.conf` and the resolver."
        explanation: "Correct. The path to the address works, so the link, address and route rungs are fine."
      - id: b
        text: "The link rung."
        explanation: "The link works. The address answers."
      - id: c
        text: "The firewall rung."
        explanation: "A firewall causes timeouts, not a name error."
      - id: d
        text: "The port rung."
        explanation: "`ping` does not use a port."
    correct_option: a
    explanation: "The path to the address works, so the link, address and route rungs are fine."

  - id: ats003-060-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find where along a path packets are lost"
    source_readings:
      - sections/section-060/module-05/course-02-follow-the-path.md
    prompt: "Which tool combines `ping` and `traceroute` to show loss at each hop?"
    options:
      - id: a
        text: "`ss`"
        explanation: "`ss` lists sockets on this host."
      - id: b
        text: "`hostnamectl`"
        explanation: "This shows host names."
      - id: c
        text: "`nslookup`"
        explanation: "This asks DNS and does not trace a path."
      - id: d
        text: "`mtr`"
        explanation: "Correct. `mtr` sends probes continuously and prints the loss and delay for every hop."
    correct_option: d
    explanation: "`mtr` sends probes continuously and prints the loss and delay for every hop."
