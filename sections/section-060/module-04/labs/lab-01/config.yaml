metadata:
  name: ats-003-lab-064
  docs:
    solution: solution.md
    question: question.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
bootstrap:
  init:
  - name: prepare-lab
    description: Prepare the independent starting state
    type: folder
    source: bootstrap/
validation:
  scripts:
  - name: verify-capture
    description: Decode a filtered pcap and verify the TCP handshake, HTTP request,
      response and this VM body
    type: file
    source: validation/verify-capture.sh
  - name: verify-evidence
    description: Check the request path and response token read from the capture
    type: file
    source: validation/verify-evidence.sh
teardown:
  keepCluster: false
