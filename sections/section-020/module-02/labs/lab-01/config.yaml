metadata:
  name: ats-003-lab-022
  docs:
    solution: solution.md
    question: question.md
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0
    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
bootstrap:
  init:
  - name: dummy-interfaces-setup
    description: Prepare dummy0 for bridge practice without changing the management
      interface
    type: folder
    source: bootstrap/
validation:
  scripts:
  - name: verify-bridge-master
    description: Confirms br0 exists, is administratively UP, and dummy0 is enslaved
      to it
    type: file
    source: validation/validate-bridge.sh
  - name: verify-bridge-forwarding
    description: Confirms `bridge link show` reports dummy0 as master br0 in forwarding
      state
    type: file
    source: validation/validate-bridge-forwarding.sh
  - name: verify-persistence
    description: Check the br0 Netplan declaration; lifecycle CI also reboots and
      checks live state
    type: file
    source: validation/validate-persistence.sh
teardown:
  keepCluster: false
